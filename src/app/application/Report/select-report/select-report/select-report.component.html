    <div class="relative w-52 mt-4">
      <app-searchable-dropdown
              [items]="categoryDropdownItems"
              placeholder="--Select--"
              searchPlaceholder="Search..."
              [(ngModel)]="reportType"
              (selectionChange)="onCategorySelectionChange($event)"
              [clearable]="true"
              [showSelected]="true"
              [disabled]="false"
              class="block w-full mb-4"
            ></app-searchable-dropdown>

    </div>

    <button
      class="bg-[#415CFF] text-lg text-white font-semibold px-6 py-2 rounded-lg shadow-lg ml-5 dark:text-textDark"
      (click)="GoBtn()">
      Go
    </button>

</div>

<div *ngIf="type === ''"
  class="flex flex-col items-center w-full h-screen px-10 py-7 bg-tileLight dark:bg-[#363636] shadow-lg rounded-lg mt-6 dark:text-black">
  <p class="text-[#494949] my-6 dark:text-[#FFFFFF]">--No Data Availabale--</p>
  <img src="assets/images/NoData.png" alt="No Data" class="w-20 h-20 dark:text-black" />
</div>

<div *ngIf="type === 'Collection Reports'" class="shadow-lg rounded-lg">
  <app-collection-report-component />
</div>

<div *ngIf="type === 'Sales Reports'" class="shadow-lg rounded-lg">
  <app-sales-report-component />
</div>
