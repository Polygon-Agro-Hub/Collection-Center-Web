<!-- ===== ROWS LIST VIEW ===== -->
<div class="max-w-[500px] p-5" *ngIf="view === 'list'">
  <div class="text-[16px] font-medium text-gray-900 dark:text-gray-100 mb-3.5">
    All Rows ({{ rows.length.toString().padStart(2, '0') }})
  </div>

  <div
    class="relative flex items-center bg-white dark:bg-gray-800 border border-[#75798F] dark:border-gray-700 rounded-xl px-4 py-3 mb-3.5 "
    *ngFor="let row of rows">
    <div class="text-[16px] font-medium text-[#030308] dark:text-gray-100 pr-8 shrink-0 whitespace-nowrap">
      {{ formatRowLabel(row.rowNumber) }}
    </div>
    <div class="absolute top-0 bottom-0 left-[90px] w-px bg-[#75798F] dark:bg-gray-600"></div>
    <div class="flex-1 font-normal text-[16px] text-[#4F6396] dark:text-[#4F6396] pl-9">
      --{{ row.positionsAvailable }} Positions Available--
    </div>
    <button
      class="rounded-lg px-7 py-1 text-[18px] transition-colors font-medium"
      [ngClass]="row.positionsAvailable > 0
        ? 'bg-[#415CFF] dark:bg-[#415CFF] text-white cursor-pointer'
        : 'bg-[#F7F7F7] dark:bg-gray-700 text-[#6B7D8C] dark:text-gray-500 cursor-not-allowed'"
      [disabled]="row.positionsAvailable <= 0"
      (click)="onPlace(row)">
      Place
    </button>
  </div>
</div>

<!-- ===== PLACEMENT VIEW ===== -->
<div class="max-w-full p-5" *ngIf="view === 'placement'">
  <button
    class="flex items-center gap-1 text-[13px] text-[#5A5874] dark:text-gray-400 mb-5 font-normal"
    (click)="goBack()">
    <i class="fa-solid fa-arrow-left"></i>
    <span class="underline">Go Back</span>
  </button>

  <div class="text-[16px] font-normal text-gray-900 dark:text-gray-100 mb-4">
    Selected Row : <span class="font-semibold">{{ formatSelectedRowLabel(selectedRow!.rowNumber) }}</span>
  </div>

  <div
    class="flex items-stretch rounded-md overflow-hidden border border-[#415CFF] dark:border-[#415CFF] mb-3.5 min-h-16"
    *ngFor="let slot of positions">

    <div class="bg-[#F3F4FF] dark:bg-[#F3F4FF] flex justify-center items-center text-[16px] font-medium text-[#415CFF] dark:text-indigo-400 w-[70px] shrink-0">
      {{ slot.code }}
    </div>

    <div class="flex-1 bg-white dark:bg-gray-800 flex items-center flex-wrap gap-2 px-3 py-2">
      <span
        class="flex items-center gap-1.5 bg-[#F8F8F8] border font-normal border-[#4A4C59] dark:bg-gray-700 text-[#4A4C59] dark:text-gray-200 text-[16px] px-3 py-1.5 rounded-md"
        *ngFor="let item of slot.items; let i = index">
        {{ item }}
        <button
          type="button"
          class="text-gray-500 dark:text-gray-400 hover:text-gray-800 dark:hover:text-gray-200 leading-none"
          (click)="removeItem(slot, i)">
          &times;
        </button>
      </span>
    </div>

    <div class="flex items-center pr-3">
      <button
        class="w-9 h-9 flex items-center justify-center rounded-md bg-black dark:bg-gray-900 text-white  font-medium hover:bg-gray-800 transition-colors"
        (click)="onAddSlot(slot)">
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>
  </div>

  <div class="border-t border-gray-200 dark:border-gray-700 pt-5 mt-6 flex justify-center gap-4">
    <button
      class="rounded-lg px-8 py-2 text-[18px] font-medium border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-800 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors min-w-16"
      (click)="onCancel()">
      Cancel
    </button>
    <button
      class="rounded-lg px-8 py-2 text-[18px] font-medium bg-[#415CFF] text-white hover:bg-[#415CFF] transition-colors min-w-16"
      (click)="onSave()">
      Save
    </button>
  </div>
</div>
